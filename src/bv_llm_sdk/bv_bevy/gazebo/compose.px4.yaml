services:
  simulator:
    container_name: bv-simulator
    image: bv-simulator:latest
    platform: linux/amd64
    build:
      context: .
      target: px4-sitl
    ports:
      - "127.0.0.1:7001:7001"
      - "14580:14580/udp"
      - "18570:18570/udp"
    env_file:
      - ../config/suas.env
    environment:
      BV_BRIDGE_CONFIG: /opt/bv/config/px4_x500_gimbal.json
      BV_PX4_WORLD: bv_mission
      BV_PX4_NAV_DLL_ACT: "0"
      PX4_PARAM_SIM_BAT_MIN_PCT: "100"
